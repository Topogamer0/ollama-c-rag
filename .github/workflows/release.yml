name: Release

# A tag v* publishes ragc.exe for Windows x64, with the DLLs it needs, as a
# zip attached to the GitHub release of the tag: the one created from the
# GitHub page if there is one (published or draft), else a new one. Then,
# unless the tag is a pre-release (v1.2.0-rc.1), it updates the ollama-c-rag
# formula of the Homebrew tap (https://github.com/Topogamer0/homebrew-tap) to
# the source archive of the tag. Run by hand on a branch, the workflow only
# builds the zip, as an artifact of the run; on a tag, it also attaches the zip
# to the release of the tag, but does not update the formula.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: ragc.exe for Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install libcurl
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install curl:x64-windows'
      - name: Build and test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DRAG_BUILD_EXAMPLES=OFF -DRAG_INSTALL_RUNTIME_DLLS=ON
          cmake --build build --config Release -j
          ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --install build --config Release --prefix "$PWD/install"
          $version = (./install/bin/ragc.exe --version) -replace '^ragc ', ''
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "the tag $env:GITHUB_REF_NAME does not match the version of ragc ($version)"
          }
          $name = "ragc-$version-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item install/bin/ragc.exe, install/bin/*.dll, README.md, LICENSE $name
          # the licenses of what ragc.exe contains (Ollama-C) and of the DLLs (libcurl, zlib)
          $share = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share"
          Copy-Item install/share/doc/ollama-c/LICENSE "$name/LICENSE-ollama-c.txt"
          Copy-Item "$share/curl/copyright" "$name/LICENSE-curl.txt"
          Copy-Item "$share/zlib/copyright" "$name/LICENSE-zlib.txt"
          Get-ChildItem $name | Format-Table Name, Length
          # it must run from its own directory, with nothing else on PATH
          $path = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "$name/ragc.exe" --version
          $env:PATH = $path
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ZIP=$name.zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ragc-windows-x64
          path: ${{ env.ZIP }}
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          # the release of the tag made from the GitHub page, published or draft, is used as it is:
          # a second release is created only when there is none
          function Test-Release { gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null; $LASTEXITCODE -eq 0 }
          if (-not (Test-Release)) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes --verify-tag
            # it fails if a release was published from the page meanwhile: then that one is used
            # (a draft saved in that same instant does not make it fail)
            if ($LASTEXITCODE -ne 0 -and -not (Test-Release)) { exit 1 }
          }
          gh release upload $tag $env:ZIP --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

  homebrew:
    name: Update the Homebrew formula
    needs: windows
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: Topogamer0/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          fetch-depth: 0

      - name: Update Formula/ollama-c-rag.rb
        working-directory: homebrew-tap
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/bump-formula.py Formula/ollama-c-rag.rb "${TAG#v}"

      - name: Commit and push
        working-directory: homebrew-tap
        env:
          FORMULA: ollama-c-rag
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if git diff --quiet; then
            echo "Formula/$FORMULA.rb is already at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "$FORMULA $VERSION"
          # Another release may have pushed to the tap meanwhile: rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          echo "::error::Could not push to Topogamer0/homebrew-tap."
          exit 1
